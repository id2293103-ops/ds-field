<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DS 현장야장</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2a4b9d"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<!-- DS-PLAN(야장 프로그램) 연동용 현장 스케치 — 저장 파일(DS-FIELD-1)을 DS-PLAN [열기] 로 넣으면 축선·기둥·보·벽·트러스·조사·사진으로 들어감 -->
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI','Pretendard','Malgun Gothic',system-ui,sans-serif;background:#e4e9f0;color:#1d2733;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
.bar{position:fixed;left:0;right:0;background:#fff;display:flex;align-items:center;gap:6px;padding:0 8px;overflow-x:auto;z-index:5}
#top{top:0;height:56px;border-bottom:2px solid #c9d4e0}
#bot{bottom:0;height:64px;border-top:2px solid #c9d4e0}
button{font:inherit;font-size:14px;height:44px;min-width:44px;padding:0 11px;border-radius:9px;border:1px solid #c3cedb;background:#fff;color:#1d2733;white-space:nowrap;flex:none}
button.on{background:#2a4b9d;color:#fff;border-color:#2a4b9d}
button.pen{display:flex;align-items:center;gap:6px}
button.pen i{width:18px;height:18px;border-radius:4px;flex:none}
button.pen.on{background:#eef2f7;color:#1d2733;border:3px solid #2a4b9d}
.sep{width:1px;height:34px;background:#c9d4e0;flex:none}
input,select{font:inherit;font-size:15px;height:40px;border:1px solid #c3cedb;border-radius:8px;padding:0 8px;background:#fff;color:#1d2733}
#cv{position:fixed;left:0;right:0;top:56px;bottom:64px;width:100%;height:calc(100% - 120px);touch-action:none;background:#fff}
#ed{position:fixed;display:none;width:96px;height:42px;font-size:19px;text-align:center;z-index:9;border:2px solid #2a4b9d}
#hint{position:fixed;left:10px;top:62px;right:10px;font-size:12.5px;color:#5b6b80;pointer-events:none;z-index:4}
#hint span{background:rgba(255,255,255,.88);padding:2px 6px;border-radius:6px}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1d2733;color:#fff;padding:9px 18px;border-radius:20px;font-size:14px;display:none;z-index:10;max-width:90%}
dialog{margin:auto;border:0;border-radius:14px;padding:18px;width:min(400px,94vw);max-height:90vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,30,45,.35)}
dialog h3{font-size:16px;margin-bottom:6px;color:#2a4b9d}
dialog label{display:block;margin:10px 0 3px;font-size:13px;color:#5b6b80}
dialog input,dialog select{width:100%}
dialog .row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
dialog small{color:#5b6b80;font-size:12px}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:flex;align-items:center;gap:4px;margin:0;padding:6px 10px;border:1px solid #c3cedb;border-radius:8px;font-size:14px;color:#1d2733}
.chk input{width:auto;height:auto}
#edx{position:fixed;display:none;gap:4px;z-index:9}
#edx button{height:38px;min-width:46px;padding:0 8px;background:#eef2f7;font-weight:700}
#selbar{position:fixed;top:62px;right:10px;display:none;align-items:center;gap:6px;z-index:6;background:#fff;border:2px solid #1c7ed6;border-radius:10px;padding:4px 6px 4px 10px;font-size:13.5px;max-width:calc(100% - 20px)}
#selbar button{height:38px}
</style></head><body>
<div id="top" class="bar">
  <b style="color:#2a4b9d;white-space:nowrap;font-size:15px">DS 현장야장</b>
  <input id="site" placeholder="현장명" style="width:150px">
  <input id="date" type="date" style="width:150px">
  <button id="bFloors">층고표</button>
  <div class="sep"></div>
  <div id="tabs" style="display:flex;gap:4px"></div>
  <button id="bAddPg">＋쪽</button>
  <button id="bPgSet">⚙ 쪽</button>
  <button id="bBg">🖼 배경</button>
  <button id="bGrid">▦ 모눈 맞춤</button>
  <div class="sep"></div>
  <button id="bInst" style="display:none">📲 앱 설치</button>
  <button id="bOpen">열기</button>
  <button id="bNew">새 현장</button>
  <button id="bSave" class="on">💾 DS-PLAN용 저장</button>
</div>
<canvas id="cv"></canvas>
<div id="hint"><span></span></div>
<div id="bot" class="bar">
  <div id="pens" style="display:flex;gap:4px"></div><button id="bAddPen">＋색</button>
  <div class="sep"></div>
  <div id="tools" style="display:flex;gap:4px"></div>
  <select id="markT" style="display:none"></select>
  <div class="sep"></div>
  <button id="bUndo">↩</button>
  <button id="bFit">⤢ 맞춤</button>
  <button id="bFinger">✋ 손가락=이동</button>
  <button id="bHw">✍ 글씨 학습</button>
</div>
<input id="ed" inputmode="decimal" autocomplete="off"><div id="edx"></div><div id="selbar"></div>
<input type="file" id="fOpen" accept=".json,application/json" style="display:none">
<input type="file" id="fBg" accept="image/*" style="display:none">
<input type="file" id="fPhoto" accept="image/*" capture="environment" style="display:none">
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const KIND={wall:'벽',col:'기둥',beam:'보',truss:'트러스'};
const SPEC_HINT={beam:'예) 300x600 · H-400x200 · ㄷ150x75',col:'예) 500x400 (가로x세로) · Ø450 (원형) · H-200x200 · □150x6',wall:'두께 mm 예) 200 = 조적 · RC200 = 콘크리트',truss:'예) P-60.5x3.2 · L-50x5'};
const MARKS=[['SH','슈미트해머'],['FS','페로스캔(철근)'],['SS','부재단면 측정'],['C','탄산화'],['VT','수직기울기'],['P','부동침하'],['L','부재변위'],
  ['CR','손상-균열'],['LK','손상-누수'],['SP','손상-박리'],['RE','손상-철근노출'],['ETC','기타']];
const TOOLS=[['mem','부재'],['sel','☝ 선택'],['dim','치수·숫자'],['memo','✎ 메모'],['mark','조사'],['photo','📷 사진'],['del','지우개']];
const HINT={mem:'선 긋기 = 벽·보·트러스 (꺾어 그으면 꺾인 벽) · 기둥 색은 톡 찍기, 찍힌 기둥 다시 톡 = 90° 돌리기',
  dim:'치수선 길게 긋기 → 칸마다 숫자를 S펜으로 옆에 쓰기 → 자동 인식(파란 숫자) · 숫자 톡 = 고치기 · 치수선 톡 = 칸 나누기 · 눈금 톡 = 눈금 없애기',
  memo:'자유 메모 (실명·Mirror·특기사항 등 — 모델엔 안 들어가고 DS-PLAN 배경 그림으로 감)',mark:'조사 위치 톡 (종류는 오른쪽에서 선택)',photo:'사진 찍을 위치 톡 → 카메라',del:'지울 것을 톡 또는 문지르기',
  sel:'톡 = 선택 → 끌어서 옮기기 · 선 끝 동그라미 끌기 = 늘이기/줄이기 · 아래 색 버튼 = 규격 바꾸기 · 기둥을 옮기면 붙은 선도 따라옴',
  bgadj:'배경 맞추기 — 펜·한 손가락으로 끌기 = 이동 · 두 손가락 = 크기·회전'};
const BEAM_C=['#f5c518','#4dabf7','#9775fa','#3bc9db','#ff8787','#69db7c','#a9743b','#2b8a7e','#e599f7','#c9a227'];
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const r1=v=>Math.round(v*10)/10;
const newPage=(type,name,fl)=>({type,name,fl:fl||[],pc:'',hl:[],cols:[],dims:[],pen:[],marks:[],photos:[]});
const newDoc=()=>({site:'',date:today(),slab:'',floors:[{n:'1F',h:''}],pal:[{id:'w1',kind:'wall',spec:'',c:'#343a40'},{id:'c1',kind:'col',spec:'',c:'#e03131'},
  {id:'b1',kind:'beam',spec:'',c:'#f5c518'},{id:'t1',kind:'truss',spec:'',c:'#ae3ec9'}],pages:[newPage('plan','','1F'.split(' '))],imgs:{}});
let D=newDoc(),P=0,tool='mem',penId='w1',markT='SH',undo=[],V={z:1,ox:60,oy:60},fingerDraw=false;
const pg=()=>D.pages[P],pal=id=>D.pal.find(p=>p.id===id)||{kind:'beam',spec:'',c:'#888'};
function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200);}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── 층고표: 층 순서 (B2F < B1F < 1F < … < PHF < R) ── */
const lvl=n=>{n=String(n).toUpperCase();let m;if((m=n.match(/^B(\d+)/)))return -(+m[1]);if((m=n.match(/^(\d+)/)))return +m[1];if(/^(R|지붕|옥상)/.test(n))return 1e4;return 5e3;};
const sortFloors=()=>D.floors.sort((a,b)=>lvl(a.n)-lvl(b.n));
const pageFl=p=>{const o=D.floors.map(f=>f.n);return(p.fl||[]).filter(n=>o.includes(n)).sort((a,b)=>o.indexOf(a)-o.indexOf(b));};
function flLabel(p){if(p.type!=='plan')return p.name||'?';const f=pageFl(p);if(!f.length)return p.name||'층?';if(f.length===1)return f[0];
  const o=D.floors.map(x=>x.n),run=o.indexOf(f[f.length-1])-o.indexOf(f[0])===f.length-1;return run?f[0]+'~'+f[f.length-1]:f.join(',');}

/* ── 자동저장: IndexedDB (사진 때문에 localStorage 로는 모자람) ── */
let _db;const db=()=>_db||(_db=new Promise((res,rej)=>{const r=indexedDB.open('ds_field',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
const idbSet=v=>db().then(d=>new Promise((res,rej)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,'doc');t.oncomplete=res;t.onerror=t.onabort=()=>rej(t.error);}));
const idbGet=()=>db().then(d=>new Promise((res,rej)=>{const r=d.transaction('k').objectStore('k').get('doc');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
let svT;function save(){clearTimeout(svT);svT=setTimeout(()=>idbSet(D).catch(e=>toast('자동저장 실패 — 바로 [DS-PLAN용 저장] 하세요: '+e)),400);}
function mod(){undo.push(JSON.stringify({P,pages:D.pages,pal:D.pal,floors:D.floors,slab:D.slab}));if(undo.length>100)undo.shift();}
function doUndo(){const s=undo.pop();if(!s)return toast('되돌릴 것 없음');const o=JSON.parse(s);Object.assign(D,{pages:o.pages,pal:o.pal,floors:o.floors,slab:o.slab});P=Math.min(o.P,D.pages.length-1);sel=null;save();ui();}
/* 예전 판(쪽마다 층고) 자동 변환 */
function migrate(d){if(!d.floors){d.floors=[];d.slab=d.slab||'';d.pages.forEach(p=>{if(p.type!=='plan')return;if(p.name&&!d.floors.some(f=>f.n===p.name))d.floors.push({n:p.name,h:p.h||''});
    if(!d.slab&&p.slab)d.slab=p.slab;p.fl=p.name?[p.name]:[];});
  d.pages.forEach(p=>{if(p.same){const t=d.pages.find(q=>q!==p&&q.fl&&q.fl.includes(p.same));if(t)t.fl.push(...p.fl);}});d.pages=d.pages.filter(p=>!(p.same&&d.pages.some(q=>q!==p&&q.fl&&q.fl.includes(p.same))));}
  d.pages.forEach(p=>{p.fl=p.fl||[];['hl','cols','dims','pen','marks','photos'].forEach(k=>p[k]=p[k]||[]);delete p.same;delete p.h;delete p.slab;});d.imgs=d.imgs||{};return d;}

/* ── 그리기 ── */
const cv=$('cv'),g=cv.getContext('2d');let dpr=1;
function resize(){dpr=devicePixelRatio||1;cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;if(!resize.w&&cv.clientWidth){resize.w=1;return fit();}draw();}   /* 숨은 채 열렸으면 처음 보일 때 맞춤 */
const toW=(x,y)=>[(x-V.ox)/V.z,(y-V.oy)/V.z];
function dimPts(d){const hor=Math.abs(d.b[0]-d.a[0])>=Math.abs(d.b[1]-d.a[1]);return{hor,P:d.t.map(t=>[d.a[0]+(d.b[0]-d.a[0])*t,d.a[1]+(d.b[1]-d.a[1])*t])};}
function dimLabels(d,z){const{hor,P:Q}=dimPts(d),o=[];for(let i=0;i+1<Q.length;i++)o.push([(Q[i][0]+Q[i+1][0])/2-(hor?0:22/z),(Q[i][1]+Q[i+1][1])/2-(hor?14/z:0)]);return o;}
/* 기둥 모양: 규격 글자에서 (Ø = 원, 가로x세로 = 그 비율 직사각형), r = 90° 돌림 */
function colGeom(c){const s=String(pal(c.p).spec||'');if(/^\s*(Ø|ø|∅|Φ|φ|O|D|P(IPE)?)\s*-?\s*\d/i.test(s))return{circ:1,w:1,h:1};
  const n=(s.match(/\d+(\.\d+)?/g)||[]).map(Number);let w=1,h=1;if(n.length>=2&&!/^\s*H/i.test(s)){w=n[0];h=n[1];}return c.r?{w:h,h:w}:{w,h};}
function render(c,p,z,ox,oy){const u=1/z;c.save();c.translate(ox,oy);c.scale(z,z);c.lineCap=c.lineJoin='round';
  p.pen.forEach(s=>{c.strokeStyle=s.c||'#222';c.lineWidth=2*u;c.beginPath();s.pts.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.stroke();});
  p.hl.forEach(s=>{const k=pal(s.p);c.globalAlpha=k.kind==='beam'?.8:1;c.strokeStyle=k.c;c.lineWidth=(k.kind==='truss'?3.5:7)*u;c.beginPath();c.moveTo(...s.pts[0]);c.lineTo(...s.pts[1]);c.stroke();});
  c.globalAlpha=1;
  p.cols.forEach(q=>{const k=pal(q.p),G=colGeom(q),S=16*u/Math.max(G.w,G.h),w=G.w*S,h=G.h*S;c.fillStyle='rgba(255,255,255,.85)';c.strokeStyle=k.c;c.lineWidth=2.2*u;c.beginPath();
    if(G.circ)c.arc(q.x,q.y,8*u,0,7);else c.rect(q.x-w/2,q.y-h/2,w,h);c.fill();c.stroke();});
  c.font=`bold ${15*u}px sans-serif`;c.textAlign='center';c.textBaseline='middle';
  p.dims.forEach(d=>{const{hor,P:Q}=dimPts(d);c.strokeStyle='#e03131';c.lineWidth=1.6*u;c.beginPath();c.moveTo(...d.a);c.lineTo(...d.b);
    Q.forEach(q=>{if(hor){c.moveTo(q[0],q[1]-7*u);c.lineTo(q[0],q[1]+7*u);}else{c.moveTo(q[0]-7*u,q[1]);c.lineTo(q[0]+7*u,q[1]);}});c.stroke();
    dimLabels(d,z).forEach((L,i)=>{const v=d.v[i];c.fillStyle=v?'#1c4fd6':'#e03131';c.fillText(v||'?',L[0],L[1]);});});
  p.marks.forEach(m=>{c.strokeStyle=c.fillStyle='#e8590c';c.lineWidth=2*u;c.beginPath();c.arc(m.x,m.y,8*u,0,7);c.stroke();c.font=`bold ${12*u}px sans-serif`;c.fillText(`${m.t==='SS'?'Ss':m.t==='ETC'?'M':m.t}-${m.no}`,m.x,m.y-16*u);});
  p.photos.forEach(q=>{c.font=`${18*u}px sans-serif`;c.fillText('📷',q.x,q.y);c.fillStyle='#e8590c';c.font=`bold ${11*u}px sans-serif`;c.fillText('P'+q.no,q.x,q.y+15*u);});
  c.restore();}
function draw(over){g.setTransform(dpr,0,0,dpr,0,0);const W=cv.clientWidth,H=cv.clientHeight;g.fillStyle='#fff';g.fillRect(0,0,W,H);
  bgDraw(g,pg(),V.z,V.ox,V.oy);
  const st=GRID*V.z;if(st>=7){g.strokeStyle=gridSnap?'#c9d4e0':'#e9eef4';g.lineWidth=1;g.beginPath();for(let x=V.ox%st;x<W;x+=st){g.moveTo(x,0);g.lineTo(x,H);}for(let y=V.oy%st;y<H;y+=st){g.moveTo(0,y);g.lineTo(W,y);}g.stroke();}
  render(g,pg(),V.z,V.ox,V.oy);selDraw();
  if(inkBuf.length){g.strokeStyle='#1c7ed6';g.lineWidth=2.4;g.lineCap='round';inkBuf.forEach(s=>{g.beginPath();s.forEach((w,i)=>{const x=w[0]*V.z+V.ox,y=w[1]*V.z+V.oy;i?g.lineTo(x,y):g.moveTo(x,y);});if(s.length===1)g.lineTo(s[0][0]*V.z+V.ox+.5,s[0][1]*V.z+V.oy);g.stroke();});}
  if(over)over();}

/* 배경 도면 (따라 그리기용 사진) — 그림은 D.imgs 에, 쪽에는 자리만 {key,x,y,w,h,r,o,show} */
const bgImg={};
function bgDraw(c,p,z,ox,oy){const b=p.bg;if(!b||!b.show||!D.imgs[b.key])return;let im=bgImg[b.key];
  if(!im){im=bgImg[b.key]=new Image();im.onload=()=>draw();im.src=D.imgs[b.key];}if(!im.complete||!im.naturalWidth)return;
  c.save();c.globalAlpha=b.o;c.translate(ox,oy);c.scale(z,z);c.translate(b.x,b.y);c.rotate(b.r||0);c.drawImage(im,-b.w/2,-b.h/2,b.w,b.h);c.restore();}

/* ── 맞춤(스냅) ── */
const GRID=40;let gridSnap=false;   /* 모눈 1칸 = 1 m, 맞춤은 반 칸(0.5 m) 단위 */
const gs=q=>gridSnap?[Math.round(q[0]/20)*20,Math.round(q[1]/20)*20]:q;
function nodes(p){const o=p.cols.map(c=>[c.x,c.y]);p.hl.forEach(s=>o.push(s.pts[0],s.pts[1]));return o;}
function snapNode(q,p,tol){let b=null,bd=tol;nodes(p).forEach(n=>{const d=Math.hypot(n[0]-q[0],n[1]-q[1]);if(d<bd){bd=d;b=n;}});return b&&[b[0],b[1]];}
function snapSeg(q,p,tol){let b=null,bd=tol;p.hl.forEach(s=>{const[a,c]=s.pts,vx=c[0]-a[0],vy=c[1]-a[1],t=((q[0]-a[0])*vx+(q[1]-a[1])*vy)/(vx*vx+vy*vy||1);
  if(t<=0.02||t>=0.98)return;const x=a[0]+vx*t,y=a[1]+vy*t,d=Math.hypot(x-q[0],y-q[1]);if(d<bd){bd=d;b=[x,y];}});return b;}
const segDist=(q,a,b)=>{const vx=b[0]-a[0],vy=b[1]-a[1],t=Math.max(0,Math.min(1,((q[0]-a[0])*vx+(q[1]-a[1])*vy)/(vx*vx+vy*vy||1)));return Math.hypot(a[0]+vx*t-q[0],a[1]+vy*t-q[1]);};
function rdp(pts,eps){if(pts.length<3)return pts;const a=pts[0],b=pts[pts.length-1],L=Math.hypot(b[0]-a[0],b[1]-a[1])||1;let mi=0,md=0;
  pts.forEach((q,i)=>{const d=Math.abs((b[0]-a[0])*(a[1]-q[1])-(a[0]-q[0])*(b[1]-a[1]))/L;if(d>md){md=d;mi=i;}});
  return md<eps?[a,b]:rdp(pts.slice(0,mi+1),eps).slice(0,-1).concat(rdp(pts.slice(mi),eps));}
/* 한 획 → 꺾인 곳마다 직선 (가로/세로는 곧게, 끝은 기둥·선 끝에 붙임) */

function shot(p,legend){const B=bounds(p);if(!B)return null;const pad=30,w=B[2]-B[0]+2*pad,h=B[3]-B[1]+2*pad,s=Math.min(2,2400/Math.max(w,h)),x=B[0]-pad,y=B[1]-pad,LH=22;

  const x2=c.getContext('2d');x2.fillStyle='#fff';x2.fillRect(0,0,c.width,c.height);
  x2.font='bold 15px sans-serif';x2.textBaseline='middle';legend.forEach(([col,t],i)=>{const yy=10+i*LH+LH/2;if(col){x2.fillStyle=col;x2.fillRect(10,yy-5,28,10);}x2.fillStyle='#1d2733';x2.fillText(t,col?46:10,yy);});
  render(x2,p,s,-x*s,-y*s+L);return{img:c.toDataURL('image/jpeg',.8),s,x,y,ox:0,oy:L};}   /* DS-PLAN: 그림 px = (x - sh.x)*sh.s + sh.ox (범례 높이만큼 아래로) */
const rotSpec=s=>{const m=String(s).match(/^\s*(\d+(?:\.\d+)?)\s*[xX×*]\s*(\d+(?:\.\d+)?)\s*$/);return m?m[2]+'x'+m[1]:null;};
/* 앱 모양 → DS-FIELD-1: 층 여러 개인 평면은 첫 층에 그림, 나머지 층은 same 쪽으로 펼침 · 돌린 기둥은 규격 가로세로 바꾼 색으로 */
function buildOut(){const pal=D.pal.map(k=>({id:k.id,kind:k.kind,spec:k.spec,c:k.c})),pages=[],shots=[],imgs={},hOf=n=>(D.floors.find(f=>f.n===n)||{}).h||'';
  D.pages.forEach(p0=>{const p=JSON.parse(JSON.stringify(p0));p.dims.forEach(d=>delete d.ink);
    p.cols=p.cols.map(c=>{if(!c.r)return c;const k=pal.find(q=>q.id===c.p),rs=k&&rotSpec(k.spec);if(!rs)return c;const id=c.p+'~r';
      if(!pal.some(q=>q.id===id))pal.push({id,kind:'col',spec:rs,c:k.c});return Object.assign({},c,{p:id});});
    const used=D.pal.filter(k=>p0.hl.some(s=>s.p===k.id)||p0.cols.some(c=>c.p===k.id)),leg=used.map(k=>[k.c,`${KIND[k.kind]}  ${k.spec||'(규격 없음)'}`]);
    if(p.type!=='plan'){delete p.fl;if(p.type==='memo'){p.hl=[];p.cols=[];p.dims=[];}pages.push(p);shots.push(shot(p0,leg));return;}
    const fl=pageFl(p0),names=fl.length?fl:[p0.name||'1F'];if(p0.type==='plan')p.photos.forEach(q=>{if(D.imgs[q.no])imgs[q.no]=D.imgs[q.no];});
    leg.push([null,`${flLabel(p0)}   `+names.map(n=>hOf(n)?`${n} H${hOf(n)}`:'').filter(Boolean).join(' · ')+(D.slab?`  · Slab ${D.slab}`:'')]);
    delete p.fl;pages.push(Object.assign(p,{name:names[0],h:hOf(names[0]),slab:D.slab||'',memo:p0.name||''}));shots.push(shot(p0,leg));
    names.slice(1).forEach(n=>{pages.push({type:'plan',name:n,h:hOf(n),slab:'',same:names[0],hl:[],cols:[],dims:[]});shots.push(null);});});
  const bgs={};D.pages.forEach(p=>{if(p.bg&&D.imgs[p.bg.key])bgs[p.bg.key]=D.imgs[p.bg.key];});   /* 배경 도면은 다시 열 때만 씀 (DS-PLAN 은 무시) */
  return{fmt:'DS-FIELD-1',app:'DS현장야장 2.1',site:D.site,date:D.date,pal,pages,shots,_imgs:imgs,_bg:bgs};}
/* DS-FIELD-1 → 앱 모양 (저장했던 파일 다시 열기) */
function fromFile(d){const pages=[],floors=[];
  d.pages.forEach(p=>{if(p.type==='plan'&&p.name&&!floors.some(f=>f.n===p.name))floors.push({n:p.name,h:p.h||''});
    if(p.type==='plan'&&p.same){const t=pages.find(q=>q.fl.includes(p.same));if(t){t.fl.push(p.name);return;}}
    const q=Object.assign(newPage(p.type||'plan',''),p);q.name=p.type==='plan'?(p.memo||''):(p.name||'');q.fl=p.type==='plan'?[p.name]:[];
    q.cols=q.cols.map(c=>/~r$/.test(c.p)?Object.assign({},c,{p:c.p.slice(0,-2),r:1}):c);['same','memo','h','slab'].forEach(k=>delete q[k]);pages.push(q);});

function checkOut(){const o=[],seen={};D.pages.forEach(p=>{const nm=flLabel(p);if(p.type==='memo')return;

    if((p.hl.length||p.cols.length)&&!(hasH&&hasV))o.push(`${nm}: 가로·세로 치수선이 모두 있어야 모델이 됩니다`);
    const hx=[],vy=[];p.dims.forEach(d=>{const{hor,P:Q}=dimPts(d);Q.forEach(q=>(hor?hx:vy).push(hor?q[0]:q[1]));});const ok=(v,a)=>a.some(x=>Math.abs(x-v)<=10);
    const un=p.hl.filter(s=>pal(s.p).kind!=='truss'&&!s.pts.every(q=>ok(q[0],hx)&&ok(q[1],vy))).length+p.cols.filter(c=>!(ok(c.x,hx)&&ok(c.y,vy))).length;
    if(un&&hasH&&hasV)o.push(`${nm}: 치수 눈금에 안 걸린 부재 ${un}개 (그린 위치 비율로 들어감 — 괜찮으면 무시)`);}
  if(p.type==='elev'&&p.hl.length&&!(hasH||hasV))o.push(`${nm}: 스팬·높이 치수가 없습니다`);if(nb)o.push(`${nm}: 치수 숫자 빈칸 ${nb}`);});
  D.floors.forEach(f=>{if(!seen[f.n])o.push(`층고표의 ${f.n}: 그린 평면이 없어 DS-PLAN 에 안 들어감`);});
  const el=D.pages.filter(p=>p.type==='elev');if(el.length>1&&el.some(p=>!p.pc))o.push('트러스 입면이 여럿인데 「평면에 그은 색」이 빈 쪽이 있습니다');
  return o;}
$('bSave').onclick=()=>{processInk();if(edAt)commitEd(false);const w=checkOut();if(w.length&&!confirm('확인할 것:\n · '+w.join('\n · ')+'\n\n그래도 저장할까요?'))return;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(buildOut())],{type:'application/json'}));
  a.download=`${(D.site||'현장').replace(/[\\/:*?"<>|]/g,'_')}_${D.date}_현장야장.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast('저장됨 (다운로드 폴더) → DS-PLAN [열기]로 넣으세요');};
$('bOpen').onclick=()=>{$('fOpen').value='';$('fOpen').click();};
$('fOpen').onchange=async e=>{const f=e.target.files[0];if(!f)return;let d;try{d=JSON.parse(await f.text());}catch(err){return alert('JSON 을 읽지 못했습니다');}
  if(!d||d.fmt!=='DS-FIELD-1'||!Array.isArray(d.pages)||!d.pages.length)return alert('현장야장 파일(DS-FIELD-1)이 아닙니다 — 지금 그림은 그대로입니다');
  if(!confirm('지금 그림을 이 파일로 바꿀까요? (지금 것은 먼저 저장해 두세요)'))return;
  D=fromFile(d);P=0;penId=D.pal[0].id;undo=[];save();ui();fit();};
$('bNew').onclick=()=>{if(!confirm('새 현장을 시작할까요?\n지금 그림은 지워집니다 — 먼저 [DS-PLAN용 저장] 하세요.'))return;D=newDoc();P=0;penId='w1';undo=[];save();ui();fit();};

addEventListener('resize',resize);
/* 홈 화면 앱(PWA): https 주소로 열었을 때만 — 오프라인 실행, 자동보관이 지워지지 않게 */
if('serviceWorker'in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
let instEv=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;$('bInst').style.display='';});
$('bInst').onclick=()=>{if(!instEv)return;instEv.prompt();instEv.userChoice.finally(()=>{instEv=null;$('bInst').style.display='none';});};
hwLoad();
idbGet().then(d=>{if(d&&d.pages&&d.pages.length)D=migrate(d);}).catch(()=>{}).finally(()=>{penId=D.pal[0].id;resize();ui();fit();});
</script>
